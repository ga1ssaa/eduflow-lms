<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F8FC" />
    <meta
      name="description"
      content="EduFlow helps you discover courses, follow a clear learning path, and keep track of your progress."
    />
    <title>EduFlow — Keep learning</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var preference = localStorage.getItem('eduflow-theme') || 'system';
        var dark =
          preference === 'dark' ||
          (preference === 'system' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
