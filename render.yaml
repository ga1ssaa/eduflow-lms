# Preparation only: importing this Blueprint starts a deployment. Obtain approval first.
services:
  - type: web
    name: eduflow-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AUTH_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ISSUER
        value: eduflow
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: lax
      - key: REFRESH_COOKIE_NAME
        value: eduflow_refresh
      - key: DATABASE_CONNECT_TIMEOUT
        value: "15"
      # One process, with bounded request concurrency for Argon2's memory cost.
      # Uvicorn reads these from the process environment, not a dotenv file.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: UVICORN_LIMIT_CONCURRENCY
        value: "4"
